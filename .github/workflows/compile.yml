name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compile_industry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add a track here (and tag the matching bullets in data.typ)
        # to get it compiled automatically -- no other CI changes needed.
        track: [eda, general]

    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
      - name: Compile ${{ matrix.track }} CV
        working-directory: industry
        run: typst compile --input track=${{ matrix.track }} main.typ ${{ matrix.track }}.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: industry_cv_${{ matrix.track }}
          path: industry/${{ matrix.track }}.pdf

  commit_compiled:
    runs-on: ubuntu-latest
    needs: [compile_industry]
    steps:
      - uses: actions/checkout@v4
      - name: Download Industry CVs
        uses: actions/download-artifact@v4
        with:
          pattern: industry_cv_*
          path: industry
          merge-multiple: true
      - name: Add and Commit
        uses: EndBug/add-and-commit@v7.4.0
        with:
          add: 'industry/*.pdf --force'
          author_name: 'github-actions[bot]'
          author_email: 'github-actions[bot]@users.noreply.github.com'
          message: 'Compiled'

  deploy_pages:
    # Only publish on pushes to main -- PR builds don't touch the live site.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [compile_industry]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Industry CVs
        uses: actions/download-artifact@v4
        with:
          pattern: industry_cv_*
          path: site
          merge-multiple: true
      - name: Add landing page
        run: cp pages/index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
