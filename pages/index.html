<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nick — CV</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                    Arial, sans-serif;
                max-width: 40em;
                margin: 4em auto;
                padding: 0 1.5em;
                line-height: 1.5;
            }
            h1 {
                font-size: 1.4em;
                margin-bottom: 0.2em;
            }
            p.sub {
                color: #666;
                margin-top: 0;
            }
            ul {
                list-style: none;
                padding: 0;
            }
            li {
                margin: 0.6em 0;
            }
            a.card {
                display: block;
                padding: 0.9em 1.1em;
                border: 1px solid #ccc;
                border-radius: 8px;
                text-decoration: none;
                color: inherit;
            }
            a.card:hover {
                border-color: #888;
            }
            a.card strong {
                display: block;
            }
            a.card span {
                color: #666;
                font-size: 0.9em;
            }
        </style>
    </head>
    <body>
        <h1>Nick — CV</h1>
        <p class="sub">
            Pick the edition that fits what you're reading this for.
        </p>
        <ul>
            <li>
                <a class="card" href="eda.pdf">
                    <strong>EDA / Computational Geometry</strong>
                    <span>R&amp;D-flavored edition — download PDF</span>
                </a>
            </li>
            <li>
                <a class="card" href="general.pdf">
                    <strong>General Software</strong>
                    <span
                        >Systems / backend-flavored edition — download PDF</span
                    >
                </a>
            </li>
        </ul>
    </body>
</html>
